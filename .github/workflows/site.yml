name: Update data & deploy site

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * 1"        # every Monday 04:17 UTC — refresh publications, repos & talks
  workflow_dispatch:
    inputs:
      refresh:
        description: "Refresh publications/repos from OpenAlex & GitHub before building"
        type: boolean
        default: true

permissions:
  contents: write     # commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh data (OpenAlex, GitHub, Google Scholar)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_data.py

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "Auto-update publications and repositories [skip ci]"
            git push
          fi

      - name: Fetch talk titles (every build, so new videos get their title right away)
        if: github.event_name == 'push'
        run: python scripts/update_data.py --only talks || true

      - name: Build site
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
