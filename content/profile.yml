# Short intro shown at the top of the home page (Markdown allowed)
bio: |
  I am a tenure-track researcher in the **Complex Systems Group** of the Department of
  Physics and Astronomy at the University of Florence. My main research is on
  **machine learning** and **complex systems**: I design learning algorithms grounded in
  dynamical systems and spectral methods, study how they learn and generalise, and apply
  them to problems in physics, combinatorial optimization, biology and medicine.
  A second line of my research is **quantum thermodynamics**, where I study the energetic
  cost and irreversibility of quantum operations and technologies.

  Before joining Florence I was a postdoctoral researcher at Instituto de
  Telecomunicações (Lisbon) and the Portuguese Quantum Institute, a visiting researcher
  at the Broad Institute of MIT and Harvard, and an external consultant for D-Wave Systems.
  I teach machine learning, statistical mechanics and computational physics in the
  Physics MSc and PhD programmes in Florence.

interests:
  - "Machine learning theory: spectral and dynamical-systems networks"
  - Complex systems & combinatorial optimization
  - Machine learning for physics, biology and medicine
  - Quantum machine learning
  - Quantum thermodynamics (secondary line)

